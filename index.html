<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Spectra — coverage by outlet bias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --side: #0f0f10; --bg: #141415; --card: #19191b; --raised: #232325;
    --line: rgba(237, 237, 237, 0.08);
    --text: #ededed; --text-2: #a1a1a6; --text-3: #85858b;
    --accent: #e8b04a; --on-accent: #1a1405;
    --L: #5b8def; --C: #6b6b72; --R: #e0705f;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/20px var(--sans); }
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); max-width: 1600px; min-height: 100vh; margin: 0 auto; }

  aside { background: var(--side); border-right: 1px solid var(--line); padding: 20px 16px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 16px; }
  .logo { font-size: 16px; line-height: 16px; font-weight: 500; padding: 4px 8px 8px; display: flex; align-items: center; gap: 8px; }
  .logo i { display: flex; gap: 2px; width: 16px; height: 12px; }
  .logo i b { flex: 1; border-radius: 2px; }
  .logo i b:nth-child(1) { background: var(--L); } .logo i b:nth-child(2) { background: var(--C); } .logo i b:nth-child(3) { background: var(--R); }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 10px; }
  input { width: 100%; height: 36px; padding: 0 36px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; transition: border-color 150ms var(--ease); }
  input::placeholder { color: var(--text-3); }
  input:hover { border-color: rgba(237, 237, 237, 0.16); }
  kbd { position: absolute; right: 8px; top: 8px; font: 400 12px/16px var(--mono); color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; background: var(--raised); }
  .nav-label { color: var(--text-3); font-size: 12px; line-height: 16px; padding: 8px 8px 0; margin-top: 8px; }
  nav { display: flex; flex-direction: column; gap: 2px; margin-top: -8px; }
  nav button { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--text-2); font: inherit; font-weight: 500; text-align: left; cursor: pointer; transition: background-color 150ms var(--ease), color 150ms var(--ease); }
  nav button:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
  nav button[aria-pressed="true"] { color: var(--text); background: var(--raised); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
  nav svg { flex: none; color: var(--text-3); }
  nav button[aria-pressed="true"] svg { color: var(--accent); }
  nav .n { margin-left: auto; font: 400 12px/16px var(--mono); color: var(--text-3); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { margin-top: auto; padding: 0 8px; color: var(--text-3); font-size: 12px; line-height: 16px; }

  main { padding: 32px; min-width: 0; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  h1 { margin: 0; font: 500 28px/32px var(--sans); }
  #status { color: var(--text-3); font: 400 12px/16px var(--mono); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .stat span { color: var(--text-2); }
  .stat b { display: block; margin-top: 8px; font: 500 32px/32px var(--sans); font-variant-numeric: tabular-nums; }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  summary { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 8px 32px; align-items: center; padding: 16px 20px; cursor: pointer; list-style: none; border-radius: 12px; transition: background-color 150ms var(--ease); }
  summary:hover { background: rgba(255, 255, 255, 0.02); }
  summary::-webkit-details-marker { display: none; }
  h2 { margin: 0 0 4px; font: 500 16px/24px var(--sans); text-wrap: balance; }
  .meta { color: var(--text-3); font: 400 12px/16px var(--mono); display: flex; gap: 12px; align-items: center; }
  .blind { color: var(--accent); }
  .counts { display: flex; justify-content: space-between; font: 400 12px/16px var(--mono); color: var(--text-2); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .counts .L::before, .counts .C::before, .counts .R::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: currentColor; }
  .counts .L::before { color: var(--L); } .counts .C::before { color: var(--C); } .counts .R::before { color: var(--R); }
  .bar { display: flex; gap: 2px; height: 8px; }
  .bar span { border-radius: 4px; min-width: 4px; }
  .bar .L { background: var(--L); } .bar .C { background: var(--C); } .bar .R { background: var(--R); }
  ul { list-style: none; margin: 0; padding: 8px 20px 12px; border-top: 1px solid var(--line); }
  li { display: grid; grid-template-columns: 8px 176px minmax(0, 1fr); gap: 12px; align-items: center; height: 36px; }
  li .dot { width: 8px; height: 8px; border-radius: 2px; }
  li .L { background: var(--L); } li .C { background: var(--C); } li .R { background: var(--R); }
  .src { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li a { color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 150ms var(--ease); }
  li a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .empty { color: var(--text-3); padding: 32px 0; }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border: 0; border-bottom: 1px solid var(--line); }
    .note { display: none; }
    summary { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    main { padding: 20px 16px; }
    header { flex-direction: column; gap: 4px; }
    .stats { grid-template-columns: 1fr; gap: 8px; }
    .stat { display: flex; align-items: baseline; justify-content: space-between; padding: 16px; }
    .stat b { margin: 0; font-size: 24px; }
    li { grid-template-columns: 8px minmax(0, 1fr); height: auto; padding: 8px 0; }
    li .src { grid-column: 2; font-size: 12px; }
    li a { grid-column: 2; white-space: normal; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
